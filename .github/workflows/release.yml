name: Release

# Push a tag like v2.0.0 to build Bonfire.exe and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Version ("${{ github.ref_name }}".TrimStart("v"))

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/Bonfire.exe
          generate_release_notes: true
