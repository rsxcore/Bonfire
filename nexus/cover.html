<!doctype html>
<!-- Source for nexus/images/0-cover.png. Render at 1280x720 with device scale 1.5 for 1920x1080. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 520px 460px at 330px 470px, rgba(234, 88, 12, .38), transparent 70%),
      radial-gradient(ellipse 900px 600px at 900px 300px, #1d1813, #0d0b09 75%);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #E9E4DA;
    display: flex; align-items: center;
  }
  .fire { width: 600px; height: 600px; margin-left: 30px; flex: none;
          filter: drop-shadow(0 0 40px rgba(249, 115, 22, .45)); }
  .text { margin-left: 10px; }
  h1 {
    margin: 0; font-size: 118px; font-weight: 800; letter-spacing: 10px; line-height: 1;
    background: linear-gradient(90deg, #F0A35E, #E8C872);
    -webkit-background-clip: text; color: transparent;
  }
  .motto { margin: 18px 0 38px; font-size: 27px; font-style: italic; color: #B7AFA3; }
  ul { list-style: none; padding: 0; margin: 0; font-size: 26px; line-height: 1.75; }
  li::before { content: "◆"; color: #F0A35E; margin-right: 16px; font-size: 18px; vertical-align: 3px; }
  .games { margin-top: 40px; font-size: 15px; color: #857D72; letter-spacing: 0; white-space: nowrap; }
  .tag { display: inline-block; margin-top: 18px; padding: 6px 14px; border: 1px solid #F0A35E55;
         border-radius: 6px; color: #F0A35E; font-size: 17px; font-family: "Cascadia Mono", Consolas, monospace; }
</style>
</head>
<body>
  <img class="fire" src="bonfire.png" alt="">
  <div class="text">
    <h1>BONFIRE</h1>
    <div class="motto">Rest at the bonfire. Your progress is kept.</div>
    <ul>
      <li>Quick save &amp; quick load in one key</li>
      <li>Named backups, every load undoable</li>
      <li>Verified, crash-safe restores</li>
    </ul>
    <div class="games">DARK SOULS · DS II · DS III · BLOODBORNE · SEKIRO · ELDEN RING · AC VI · NIGHTREIGN</div>
    <div class="tag">free · open source · single .exe</div>
  </div>
</body>
</html>
